name: Reusable Terraform plan and apply

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label; use a runner with network access to private infrastructure when needed.
        type: string
        default: ubuntu-latest
      working-directory:
        description: Terraform root module directory in the calling repository.
        type: string
        default: .
      terraform-version:
        description: Terraform CLI version.
        type: string
        default: 1.10.3
      operation:
        description: plan or apply. Apply creates and applies the same saved plan in this job.
        type: string
        default: plan
      environment:
        description: GitHub environment in the caller; configure required reviewers there for apply approval.
        type: string
        required: true
      azure-oidc:
        description: Authenticate AzureRM using GitHub OIDC and the supplied Azure identity secrets.
        type: boolean
        default: false
      backend-config-file:
        description: Optional backend configuration file path relative to working-directory.
        type: string
        default: ''
      var-file:
        description: Optional Terraform variable file path relative to working-directory.
        type: string
        default: ''
      lockfile-readonly:
        description: Require the committed provider lock file.
        type: boolean
        default: true
      lock-timeout:
        description: How long Terraform waits to acquire the remote state lock.
        type: string
        default: 5m
      upload-plan:
        description: Upload the binary plan, which can contain sensitive values, as a workflow artifact.
        type: boolean
        default: false
      artifact-name:
        description: Plan artifact name; use distinct names for multiple calls in the same workflow run.
        type: string
        default: terraform-plan
      artifact-retention-days:
        description: Number of days to retain an uploaded plan artifact.
        type: number
        default: 1
    secrets:
      AZURE_CLIENT_ID:
        description: Client ID of the identity trusted by Azure for OIDC.
        required: false
      AZURE_TENANT_ID:
        description: Azure tenant ID.
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: Azure subscription ID.
        required: false
      TERRAFORM_VARS_JSON:
        description: Optional JSON object of Terraform input values, passed through a temporary variable file.
        required: false
    outputs:
      has-changes:
        description: Whether the saved plan contains changes (true or false).
        value: ${{ jobs.terraform.outputs.has-changes }}

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      ARM_USE_OIDC: ${{ inputs.azure-oidc && 'true' || '' }}
      ARM_USE_AZUREAD: ${{ inputs.azure-oidc && 'true' || '' }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Validate deployment inputs
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          AZURE_OIDC: ${{ inputs.azure-oidc }}
        run: |
          case "$OPERATION" in
            plan|apply) ;;
            *) echo 'operation must be plan or apply.' >&2; exit 1 ;;
          esac
          [[ -n "$ENVIRONMENT" ]] || { echo 'environment must not be empty.' >&2; exit 1; }
          if [[ "$AZURE_OIDC" == 'true' ]]; then
            [[ -n "$ARM_CLIENT_ID" && -n "$ARM_TENANT_ID" && -n "$ARM_SUBSCRIPTION_ID" ]] || {
              echo 'Azure OIDC requires client, tenant, and subscription ID secrets.' >&2
              exit 1
            }
          fi
      - name: Prepare secret variable file
        env:
          VARIABLES_JSON: ${{ secrets.TERRAFORM_VARS_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tempfile
          value = os.environ.get('VARIABLES_JSON', '')
          if value:
              try:
                  parsed = json.loads(value)
              except ValueError:
                  raise SystemExit('TERRAFORM_VARS_JSON must contain valid JSON.') from None
              if not isinstance(parsed, dict):
                  raise SystemExit('TERRAFORM_VARS_JSON must be a JSON object.')
              fd, path = tempfile.mkstemp(suffix='.tfvars.json', dir=os.environ['RUNNER_TEMP'])
              with os.fdopen(fd, 'w') as stream:
                  json.dump(parsed, stream)
              with open(os.environ['GITHUB_ENV'], 'a') as stream:
                  stream.write(f'TERRAFORM_SECRET_VARS_FILE={path}\n')
          PY
      - name: Initialize backend
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config-file }}
          READONLY: ${{ inputs.lockfile-readonly }}
        run: |
          args=(-input=false -no-color)
          if [[ -n "$BACKEND_CONFIG" ]]; then args+=("-backend-config=$BACKEND_CONFIG"); fi
          if [[ "$READONLY" == 'true' ]]; then args+=(-lockfile=readonly); fi
          terraform -chdir="$WORKING_DIRECTORY" init "${args[@]}"
      - name: Validate
        run: terraform -chdir="$WORKING_DIRECTORY" validate -no-color
      - name: Plan
        id: plan
        env:
          VAR_FILE: ${{ inputs.var-file }}
          LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
        run: |
          args=(-input=false -no-color -detailed-exitcode "-lock-timeout=$LOCK_TIMEOUT" "-out=$RUNNER_TEMP/terraform.tfplan")
          if [[ -n "$VAR_FILE" ]]; then args+=("-var-file=$VAR_FILE"); fi
          if [[ -n "${TERRAFORM_SECRET_VARS_FILE:-}" ]]; then args+=("-var-file=$TERRAFORM_SECRET_VARS_FILE"); fi
          set +e
          terraform -chdir="$WORKING_DIRECTORY" plan "${args[@]}"
          result=$?
          set -e
          case "$result" in
            0) echo 'has-changes=false' >> "$GITHUB_OUTPUT" ;;
            2) echo 'has-changes=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - name: Upload saved plan
        if: inputs.upload-plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/terraform.tfplan
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error
      - name: Apply saved plan
        if: inputs.operation == 'apply' && steps.plan.outputs.has-changes == 'true'
        env:
          LOCK_TIMEOUT: ${{ inputs.lock-timeout }}
        run: terraform -chdir="$WORKING_DIRECTORY" apply -input=false -no-color -lock-timeout="$LOCK_TIMEOUT" "$RUNNER_TEMP/terraform.tfplan"
      - name: Remove temporary variable and plan files
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          secret_file = os.environ.get('TERRAFORM_SECRET_VARS_FILE')
          if secret_file:
              Path(secret_file).unlink(missing_ok=True)
          (Path(os.environ['RUNNER_TEMP']) / 'terraform.tfplan').unlink(missing_ok=True)
          PY
