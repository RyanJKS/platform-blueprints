name: Terraform tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  terraform-tests:
    name: Terraform checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate and test modules sequentially
        run: |
          while IFS= read -r module; do
            [[ -d "$module" ]] || continue
            compgen -G "$module/*.tf" > /dev/null || continue

            echo "::group::$module"
            terraform -chdir="$module" init -backend=false -input=false -no-color
            terraform -chdir="$module" validate -no-color
            terraform -chdir="$module" test -no-color
            echo "::endgroup::"
          done < <(find terraform -type d -name .terraform -prune -o -type f -name '*.tf' -printf '%h\n' | sort -u)
